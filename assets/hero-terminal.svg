<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img"
     aria-label="ai-filmmaking-evals: an unattended AI filmmaking pipeline where the evals are the product.">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="330" fill="#0d1117"/>

  <!-- terminal window -->
  <rect x="120" y="52" width="960" height="226" rx="10" fill="#010409" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <rect x="120" y="52" width="960" height="38" rx="10" fill="#161b22"/>
  <rect x="120" y="80" width="960" height="10" fill="#161b22"/>
  <line x1="120" y1="90" x2="1080" y2="90" stroke="#30363d" stroke-width="1"/>
  <circle cx="146" cy="71" r="5.5" fill="#484f58"/>
  <circle cx="166" cy="71" r="5.5" fill="#484f58"/>
  <circle cx="186" cy="71" r="5.5" fill="#484f58"/>
  <text x="600" y="75" text-anchor="middle" class="mono" font-size="12" fill="#8b949e" letter-spacing=".3">— shashank-100 / ai-filmmaking-evals —</text>

  <!-- prompt line -->
  <text x="152" y="140" class="mono" font-size="26" font-weight="700" fill="#e6edf3">
    <tspan fill="#6e7681">$</tspan> ai-filmmaking-evals<tspan id="cur" fill="#e6edf3" dx="6" font-weight="400">▊</tspan>
  </text>

  <!-- comment / tagline -->
  <text x="152" y="182" class="mono" font-size="15" fill="#8b949e"># an unattended AI filmmaking pipeline where the evals are the product</text>

  <!-- output lines -->
  <text x="152" y="216" class="mono" font-size="14" fill="#c9d1d9">
    <tspan fill="#6e7681">&gt;</tspan> label &#8594; derive &#8594; gate &#8594; render &#8594; relabel
  </text>
  <text x="152" y="240" class="mono" font-size="14" fill="#6e7681">
    <tspan fill="#484f58">&gt;</tspan> taste captured as labels, compiled into thresholds, wired into gates
  </text>
  <text x="152" y="264" class="mono" font-size="14" fill="#6e7681">
    <tspan fill="#484f58">&gt;</tspan> that can refuse to spend.
  </text>

  <!-- blinking cursor -->
  <style>
    #cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</svg>
